# Daftar keahlian untuk slider di beranda.
# Untuk menambah keahlian: salin satu blok "- title: ..." lalu isi.
# Slider otomatis menambah halaman baru (geser kiri/kanan) kalau kartu lebih dari 6.
#
# icon  : leaf | megaphone | translate | pen | database | kanban | chart | code | camera | book
# image : opsional. Taruh file di static/images/skills/ lalu tulis "images/skills/nama.jpg"
# tags  : label kecil di bagian bawah kartu

items:
  - title: "Ekologi & Biodiversitas"
    icon: leaf
    desc: "Identifikasi flora dan fauna, survei biodiversitas, penilaian status konservasi (IUCN & KLHK), serta penyusunan laporan monitoring dan baseline lingkungan."
    image: "images/skills/ekologi.jpg"
    tags: ["Survei Lapangan", "IUCN", "Monitoring"]

  - title: "Digital Marketing & E-commerce"
    icon: megaphone
    desc: "Optimasi iklan TikTok Shop & Shopee, pengelolaan konten, analisis performa kampanye, dan strategi peningkatan penjualan."
    image: "images/skills/marketing.jpg"
    tags: ["TikTok Shop", "Shopee", "Analytics"]

  - title: "Penerjemahan & Penulisan"
    icon: translate
    desc: "Penerjemahan dokumen, penyuntingan teks, penulisan deskripsi ilmiah, dan penyusunan konten yang mudah dipahami."
    image: "images/skills/penerjemahan.jpg"
    tags: ["EN ↔ ID", "Editing", "Content Writing"]

  - title: "Desain Materi & Presentasi"
    icon: pen
    desc: "Poster, brosur, video, modul praktikum, sertifikat, dan desain materi edukasi yang informatif dan menarik."
    image: "images/skills/desain.jpg"
    tags: ["Canva", "Adobe", "Visual Communication"]

  - title: "Analisis Data & Database"
    icon: database
    desc: "Pengelolaan data survei dan database publikasi, tabulasi, visualisasi data, serta penyusunan laporan."
    image: "images/skills/data.jpg"
    tags: ["Excel", "R", "SPSS"]

  - title: "Manajemen Proyek & Kolaborasi"
    icon: kanban
    desc: "Perencanaan, koordinasi tim, penyusunan laporan, dan komunikasi dengan berbagai pihak untuk mencapai tujuan proyek."
    image: "images/skills/proyek.jpg"
    tags: ["Google Workspace", "Notion", "Teamwork"]

