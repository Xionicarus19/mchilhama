{{ define "main" }}
<section class="page-head">
  <div class="wrap narrow">
    <p class="kicker"><a href="{{ .Parent.RelPermalink }}">{{ with .Parent }}{{ if .IsHome }}Beranda{{ else }}{{ .Title }}{{ end }}{{ end }}</a></p>
    <h1>{{ .Title }}</h1>
  </div>
</section>
<section class="section">
  <div class="wrap narrow">
    <article class="prose">
      {{ .Content }}
    </article>
  </div>
</section>
{{ end }}
