<header class="site-header">
  <a class="brand" href="{{ "" | relURL }}" aria-label="Beranda">
    <svg viewBox="0 0 32 32" width="30" height="30" aria-hidden="true"><circle cx="16" cy="16" r="15" fill="none" stroke="currentColor" stroke-width="2"/><path d="M6 13c3-3 5 3 8 0s5 3 8 0 3 1 4 0M6 19c3-3 5 3 8 0s5 3 8 0 3 1 4 0" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    <span>{{ site.Title }}</span>
  </a>
  <input type="checkbox" id="nav-toggle" class="nav-toggle" aria-label="Buka menu">
  <label for="nav-toggle" class="nav-burger" aria-hidden="true"><span></span><span></span><span></span></label>
  <nav class="site-nav" aria-label="Menu utama">
    <ul>
      <li><a href="{{ "" | relURL }}"{{ if .IsHome }} class="active"{{ end }}>Beranda</a></li>
      {{ $current := . }}
      {{ range site.Menus.main }}
        {{ if ne .Name "Kontak" }}
        <li><a href="{{ .URL }}"{{ if or ($current.IsMenuCurrent "main" .) ($current.HasMenuCurrent "main" .) }} class="active"{{ end }}>{{ .Name }}</a></li>
        {{ end }}
      {{ end }}
    </ul>
    <a class="btn btn-dark" href="{{ "contact/" | relURL }}">Hubungi Saya</a>
  </nav>
</header>
